[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcquant"
version = "0.1.0"
description = "Mesin hitung & analisis pribadi emas COMEX (GC/MGC/OG) dan XAUUSD berbasis data bursa"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
databento = ["databento>=0.40"]
ml = ["lightgbm>=4.0", "scikit-learn>=1.3"]
dev = ["pytest>=7"]

[project.scripts]
gcquant = "gcquant.cli:main"

[tool.setuptools.packages.find]
include = ["gcquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
